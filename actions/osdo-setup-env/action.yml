name: "OSDO Setup Environment"
description: "Setup base environment for OSDO security compliance pipeline"
author: "OpenSecDevOps"

branding:
  icon: "settings"
  color: "gray-dark"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"
  java-version:
    description: "Java version to use"
    required: false
    default: "17"
  go-version:
    description: "Go version to use"
    required: false
    default: "1.21"
  setup-docker:
    description: "Setup Docker environment"
    required: false
    default: "true"
  results-dir:
    description: "Directory to store OSDO results"
    required: false
    default: ".osdo/results"

outputs:
  results-dir:
    description: "Path to results directory"
    value: ${{ steps.setup.outputs.results-dir }}
  cache-key:
    description: "Cache key for dependencies"
    value: ${{ steps.setup.outputs.cache-key }}

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0

    # Dependency caches are requested only when the file they key on exists.
    # setup-* actions fail when asked to cache with no matching lockfile.
    - name: Detect dependency files
      id: deps
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/detect-deps.sh"

    - name: Setup Node.js (npm cache)
      if: inputs.node-version != 'false' && steps.deps.outputs.node-cache == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      continue-on-error: true
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: "**/package-lock.json"

    - name: Setup Node.js
      if: inputs.node-version != 'false' && steps.deps.outputs.node-cache != 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      continue-on-error: true
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Python (pip cache)
      if: inputs.python-version != 'false' && steps.deps.outputs.python-cache == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: "pip"

    - name: Setup Python
      if: inputs.python-version != 'false' && steps.deps.outputs.python-cache != 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup Java
      if: inputs.java-version != 'false'
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      continue-on-error: true
      with:
        java-version: ${{ inputs.java-version }}
        distribution: "temurin"

    - name: Setup Go (module cache)
      if: inputs.go-version != 'false' && steps.deps.outputs.go-cache == 'true'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      continue-on-error: true
      with:
        go-version: ${{ inputs.go-version }}
        cache: true

    - name: Setup Go
      if: inputs.go-version != 'false' && steps.deps.outputs.go-cache != 'true'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      continue-on-error: true
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Setup Docker Buildx
      if: inputs.setup-docker == 'true'
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Create OSDO directories
      shell: bash
      run: |
        mkdir -p ${{ inputs.results-dir }}
        mkdir -p .osdo/cache
        mkdir -p .osdo/reports
        mkdir -p .osdo/artifacts
        mkdir -p .osdo/sbom
        echo "✅ Created OSDO directory structure"

    - name: Setup environment variables
      shell: bash
      id: setup
      run: |
        echo "results-dir=${{ inputs.results-dir }}" >> $GITHUB_OUTPUT
        echo "cache-key=osdo-${{ runner.os }}-${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "OSDO_RESULTS_DIR=${{ inputs.results-dir }}" >> $GITHUB_ENV
        echo "OSDO_CACHE_DIR=.osdo/cache" >> $GITHUB_ENV
        echo "OSDO_REPORTS_DIR=.osdo/reports" >> $GITHUB_ENV
        echo "OSDO_ARTIFACTS_DIR=.osdo/artifacts" >> $GITHUB_ENV
        echo "OSDO_SBOM_DIR=.osdo/sbom" >> $GITHUB_ENV
        echo "✅ Environment variables configured"

    - name: Display Environment Info
      shell: bash
      run: |
        echo "🔧 OSDO Environment Setup Complete"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Node.js: $(node --version 2>/dev/null || echo 'not installed')"
        echo "Python: $(python --version 2>/dev/null || echo 'not installed')"
        echo "Java: $(java -version 2>&1 | head -n1 || echo 'not installed')"
        echo "Go: $(go version 2>/dev/null || echo 'not installed')"
        echo "Docker: $(docker --version 2>/dev/null || echo 'not installed')"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Results Dir: ${{ inputs.results-dir }}"
        echo "Cache Key: osdo-${{ runner.os }}-${{ github.sha }}"
