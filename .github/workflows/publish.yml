name: Publicar OSDO Actions

on:
  push:
    branches:
      - main
    paths:
      - "actions/**"
  workflow_dispatch:
    inputs:
      action-name:
        description: 'Action a publicar (nombre exacto, ej: osdo-sast) o "all" para todas'
        required: true
        default: "all"
      version:
        description: "Versión a publicar (semver: v1.0.0). Vacío = auto-incremento de patch"
        required: false
      dry-run:
        description: "Dry run — no crea tags ni releases"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  # Lista canónica de todas las actions del repositorio
  ALL_ACTIONS: >-
    osdo-api-scan osdo-build-security osdo-cloud-scan osdo-compliance-report
    osdo-container-scan osdo-dast-scan osdo-fuzz osdo-iac-scan osdo-license-scan
    osdo-llm-scan osdo-mobile-scan osdo-policy-gate osdo-sast osdo-sbom osdo-sca
    osdo-secrets-scan osdo-security-gate osdo-setup-env osdo-sign
    osdo-slsa-provenance osdo-smart-contract-audit osdo-test-quality

jobs:
  # ── 1. Detectar qué actions cambiaron ────────────────────────────────────────
  detect-changes:
    name: "Detectar cambios"
    runs-on: ubuntu-latest
    outputs:
      # JSON array: ["osdo-sast","osdo-sca"]
      changed-actions: ${{ steps.detect.outputs.actions-json }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar actions modificadas
        id: detect
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.action-name }}" == "all" ]; then
              mapfile -t actions < <(ls -d actions/*/ | sed 's|actions/||;s|/$||')
            else
              # Validar que el action existe
              if [ ! -d "actions/${{ github.event.inputs.action-name }}" ]; then
                echo "::error::Action no encontrada: ${{ github.event.inputs.action-name }}"
                exit 1
              fi
              actions=("${{ github.event.inputs.action-name }}")
            fi
          else
            # Auto-detectar desde git diff
            mapfile -t changed_paths < <(git diff --name-only HEAD^ HEAD | grep '^actions/' || true)
            if [ ${#changed_paths[@]} -eq 0 ]; then
              echo "has-changes=false" >> "$GITHUB_OUTPUT"
              echo "actions-json=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Extraer nombres únicos (2do componente del path: actions/<name>/...)
            mapfile -t actions < <(printf '%s\n' "${changed_paths[@]}" | \
              cut -d'/' -f2 | sort -u)
          fi

          # Convertir a JSON array para el matrix strategy
          json="$(printf '%s\n' "${actions[@]}" | jq -R . | jq -cs .)"
          echo "has-changes=true" >> "$GITHUB_OUTPUT"
          echo "actions-json=$json" >> "$GITHUB_OUTPUT"
          echo "Actions detectadas: ${actions[*]}"

  # ── 2. Validar sintaxis y campos obligatorios ─────────────────────────────────
  validate:
    name: "Validar ${{ matrix.action }}"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        action: ${{ fromJson(needs.detect-changes.outputs.changed-actions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar yamllint
        run: pip install yamllint --quiet

      - name: Verificar estructura de la action
        run: |
          action_file="actions/${{ matrix.action }}/action.yml"

          # El archivo debe existir
          if [ ! -f "$action_file" ]; then
            echo "::error::Falta el archivo: $action_file"
            exit 1
          fi

          echo "✅ Archivo encontrado: $action_file"

      - name: Lint YAML
        run: |
          action_file="actions/${{ matrix.action }}/action.yml"
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            "$action_file" && echo "✅ YAML syntax válido"

      - name: Verificar campos obligatorios
        run: |
          action_file="actions/${{ matrix.action }}/action.yml"

          check_field() {
            local field=$1
            if ! grep -q "^${field}:" "$action_file"; then
              echo "::error::Campo obligatorio ausente '${field}' en $action_file"
              exit 1
            fi
            echo "  ✅ ${field}: presente"
          }

          echo "Verificando campos obligatorios:"
          check_field "name"
          check_field "description"
          check_field "runs"

          # Verificar que runs.using = "composite"
          if ! grep -q 'using: "composite"' "$action_file" && ! grep -q "using: composite" "$action_file"; then
            echo "::error::La action debe usar 'using: composite' en $action_file"
            exit 1
          fi
          echo "  ✅ using: composite"

          # Verificar que existe author (recomendado)
          if ! grep -q "^author:" "$action_file"; then
            echo "::warning::Campo recomendado 'author' ausente en $action_file"
          fi

          echo "✅ Todos los campos obligatorios presentes"

  # ── 3. Tests de sintaxis funcional ───────────────────────────────────────────
  test:
    name: "Test ${{ matrix.action }}"
    runs-on: ubuntu-latest
    needs: [detect-changes, validate]
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        action: ${{ fromJson(needs.detect-changes.outputs.changed-actions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Verificar estructura de inputs/outputs
        run: |
          action_file="actions/${{ matrix.action }}/action.yml"

          echo "=== Resumen de ${{ matrix.action }} ==="
          echo "Nombre:      $(yq '.name' "$action_file")"
          echo "Descripción: $(yq '.description' "$action_file")"

          input_count=$(yq '.inputs | length' "$action_file" 2>/dev/null || echo 0)
          output_count=$(yq '.outputs | length' "$action_file" 2>/dev/null || echo 0)
          step_count=$(yq '.runs.steps | length' "$action_file" 2>/dev/null || echo 0)

          echo "Inputs:      $input_count"
          echo "Outputs:     $output_count"
          echo "Steps:       $step_count"

          if [ "$step_count" -eq 0 ]; then
            echo "::error::La action no tiene steps definidos"
            exit 1
          fi

      - name: Verificar que no hay referencias relativas (./)
        run: |
          action_file="actions/${{ matrix.action }}/action.yml"
          if grep -q 'uses: \./\.' "$action_file" || grep -q "uses: './.'" "$action_file"; then
            echo "::warning::La action usa referencias relativas (./) que no funcionan desde repos externos"
          else
            echo "✅ Sin referencias relativas problemáticas"
          fi

      - name: Verificar branding (recomendado)
        run: |
          action_file="actions/${{ matrix.action }}/action.yml"
          if ! yq -e '.branding' "$action_file" > /dev/null 2>&1; then
            echo "::notice::Campo 'branding' ausente en ${{ matrix.action }} — recomendado para GitHub Marketplace"
          else
            icon=$(yq '.branding.icon' "$action_file")
            color=$(yq '.branding.color' "$action_file")
            echo "✅ Branding: icon=$icon color=$color"
          fi

  # ── 4. Crear tags versionados ─────────────────────────────────────────────────
  create-tags:
    name: "Tag ${{ matrix.action }}"
    runs-on: ubuntu-latest
    needs: [detect-changes, validate, test]
    if: |
      needs.detect-changes.outputs.has-changes == 'true' &&
      github.event.inputs.dry-run != 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        action: ${{ fromJson(needs.detect-changes.outputs.changed-actions) }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular versión
        id: version
        run: |
          action_name="${{ matrix.action }}"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            # Versión manual desde workflow_dispatch
            version="${{ github.event.inputs.version }}"
            # Asegurar prefijo 'v'
            [[ "$version" != v* ]] && version="v${version}"
          else
            # Auto-incremento de patch desde el último tag de esta action
            latest_tag=$(git tag -l "${action_name}/v*" | sort -V | tail -n1 || true)

            if [ -z "$latest_tag" ]; then
              version="v1.0.0"
            else
              current_ver=$(echo "$latest_tag" | sed "s|${action_name}/v||")
              IFS='.' read -r major minor patch <<< "$current_ver"
              version="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          tag="${action_name}/${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publicando: $tag"

      - name: Crear y publicar tag
        run: |
          tag="${{ steps.version.outputs.tag }}"
          action_name="${{ matrix.action }}"
          version="${{ steps.version.outputs.version }}"

          # Verificar que el tag no existe ya
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::warning::Tag $tag ya existe — omitiendo"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$tag" \
            -m "Release ${action_name} ${version}"$'\n\n'"$(git log --pretty=format:'- %s' -5 -- "actions/${action_name}/")"
          git push origin "$tag"

          echo "✅ Tag creado: $tag"

  # ── 5. Crear GitHub Releases ──────────────────────────────────────────────────
  create-releases:
    name: "Release ${{ matrix.action }}"
    runs-on: ubuntu-latest
    needs: [detect-changes, create-tags]
    if: |
      needs.detect-changes.outputs.has-changes == 'true' &&
      github.event.inputs.dry-run != 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        action: ${{ fromJson(needs.detect-changes.outputs.changed-actions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Obtener versión del tag recién creado
        id: tag-info
        run: |
          action_name="${{ matrix.action }}"
          latest_tag=$(git tag -l "${action_name}/v*" | sort -V | tail -n1)
          version=$(echo "$latest_tag" | sed "s|${action_name}/||")
          prev_tag=$(git tag -l "${action_name}/v*" | sort -V | tail -n2 | head -n1 || true)

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "prev-tag=$prev_tag" >> "$GITHUB_OUTPUT"

      - name: Leer metadatos de la action
        id: meta
        run: |
          action_file="actions/${{ matrix.action }}/action.yml"
          echo "name=$(yq '.name' "$action_file")" >> "$GITHUB_OUTPUT"
          echo "description=$(yq '.description' "$action_file")" >> "$GITHUB_OUTPUT"

          # Listar inputs con descripción
          inputs_md=$(yq '.inputs | to_entries[] | "| `" + .key + "` | " + (.value.description // "-") + " | " + (.value.default // "-") + " |"' \
            "$action_file" 2>/dev/null || echo "")
          echo "inputs-table<<EOF" >> "$GITHUB_OUTPUT"
          echo "$inputs_md" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # Listar outputs
          outputs_md=$(yq '.outputs | to_entries[] | "| `" + .key + "` | " + (.value.description // "-") + " |"' \
            "$action_file" 2>/dev/null || echo "")
          echo "outputs-table<<EOF" >> "$GITHUB_OUTPUT"
          echo "$outputs_md" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generar changelog
        id: changelog
        run: |
          action_name="${{ matrix.action }}"
          tag="${{ steps.tag-info.outputs.tag }}"
          prev_tag="${{ steps.tag-info.outputs.prev-tag }}"

          if [ -n "$prev_tag" ]; then
            commits=$(git log "${prev_tag}..${tag}" \
              --pretty=format:"- %s (%h)" \
              -- "actions/${action_name}/" | head -20 || echo "")
          else
            commits=$(git log \
              --pretty=format:"- %s (%h)" \
              -- "actions/${action_name}/" | head -20 || echo "")
          fi

          [ -z "$commits" ] && commits="- Actualización de dependencias y mejoras menores"

          echo "commits<<EOF" >> "$GITHUB_OUTPUT"
          echo "$commits" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag-info.outputs.tag }}
          name: "${{ steps.meta.outputs.name }} ${{ steps.tag-info.outputs.version }}"
          draft: false
          prerelease: false
          body: |
            ## 🔒 ${{ steps.meta.outputs.name }} — ${{ steps.tag-info.outputs.version }}

            ${{ steps.meta.outputs.description }}

            ### Uso

            ```yaml
            - name: ${{ steps.meta.outputs.name }}
              uses: opensecdevops/osdo-actions/actions/${{ matrix.action }}@${{ steps.tag-info.outputs.tag }}
              with:
                results-dir: .osdo/results
                # Ver todos los inputs disponibles abajo
            ```

            ### Inputs disponibles

            | Input | Descripción | Default |
            |-------|-------------|---------|
            ${{ steps.meta.outputs.inputs-table }}

            ### Outputs

            | Output | Descripción |
            |--------|-------------|
            ${{ steps.meta.outputs.outputs-table }}

            ### Changelog

            ${{ steps.changelog.outputs.commits }}

            ---

            📖 [Documentación completa](https://github.com/opensecdevops/osdo-actions/blob/${{ steps.tag-info.outputs.tag }}/actions/${{ matrix.action }}/action.yml) |
            🐛 [Reportar issue](https://github.com/opensecdevops/osdo-actions/issues)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 6. Resumen de publicación ─────────────────────────────────────────────────
  summary:
    name: "Resumen"
    runs-on: ubuntu-latest
    needs: [detect-changes, validate, test, create-tags, create-releases]
    if: always() && needs.detect-changes.outputs.has-changes == 'true'
    steps:
      - name: Generar resumen
        run: |
          dry_run="${{ github.event.inputs.dry-run }}"

          {
            echo "# 📦 OSDO Actions — Reporte de Publicación"
            echo ""
            echo "**Fecha:** $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "**Trigger:** ${{ github.event_name }}"
            [ "$dry_run" == "true" ] && echo "**Modo:** 🔍 Dry Run (sin cambios reales)"
            echo ""
            echo "## Actions procesadas"
            echo ""
            # Parsear JSON array de actions
            echo '${{ needs.detect-changes.outputs.changed-actions }}' | \
              jq -r '.[] | "- **" + . + "**"'
            echo ""
            echo "## Estado del pipeline"
            echo ""
            echo "| Etapa | Estado |"
            echo "|-------|--------|"
            echo "| Validación | ${{ needs.validate.result }} |"
            echo "| Tests | ${{ needs.test.result }} |"
            echo "| Tags | ${{ needs.create-tags.result || 'skipped' }} |"
            echo "| Releases | ${{ needs.create-releases.result || 'skipped' }} |"
            echo ""
            if [ "$dry_run" != "true" ] && [ "${{ needs.create-releases.result }}" == "success" ]; then
              echo "## Uso en otros repositorios"
              echo ""
              echo '```yaml'
              echo "# Reemplaza <action-name> por el nombre de la action publicada"
              echo "- uses: opensecdevops/osdo-actions/actions/<action-name>@<action-name>/v1.x.x"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
