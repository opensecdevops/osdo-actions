name: "OSDO LLM Security Scan"
description: "Security analysis for LLM/GenAI applications and agent prompt assets (skills, agent prompts, templates, MCP manifests), aligned with the OWASP LLM Top 10"
author: "OpenSecDevOps"
branding:
  icon: "cpu"
  color: "orange"

inputs:
  source-path:
    description: "Path to application source code and agent assets"
    required: true
  scanners:
    description: "Comma-separated external scanners. Only 'semgrep' is supported (it must be on PATH). Built-in checks always run when enabled."
    required: false
    default: "semgrep"
  fail-on-severity:
    description: "Lowest severity that fails the step: CRITICAL, HIGH, MEDIUM, LOW"
    required: false
    default: "HIGH"
  check-prompt-injection:
    description: "Prompt-injection patterns in application code (f-strings, unsanitised user input in messages)"
    required: false
    default: "true"
  check-pii-exposure:
    description: "PII-like fields placed in LLM prompts or messages"
    required: false
    default: "true"
  check-model-serialization:
    description: "Insecure model deserialization (pickle, torch.load without weights_only)"
    required: false
    default: "true"
  check-output-handling:
    description: "Insecure output handling (LLM output passed to eval/exec or rendered as HTML)"
    required: false
    default: "true"
  check-prose-injection:
    description: "Prompt-injection text in prose: *.md (incl. SKILL.md), agent prompts, templates, HTML comments, encoded payloads"
    required: false
    default: "true"
  check-hidden-unicode:
    description: "Zero-width, bidi-override and Unicode tag characters in any text file"
    required: false
    default: "true"
  check-mcp-manifests:
    description: "MCP manifests (.mcp.json, mcp.json, opencode.json): shell-executing servers, inline secrets, non-https remote URLs"
    required: false
    default: "true"
  check-tool-scope:
    description: "Agent and skill frontmatter (tools, allowed-tools, permission) that grants unrestricted Bash or write access"
    required: false
    default: "true"
  check-shell-scripts:
    description: "Run shellcheck on shell scripts. shellcheck must be on PATH."
    required: false
    default: "true"
  llm-provider:
    description: "Reported provider detection (openai, anthropic, google, huggingface). Informational only."
    required: false
    default: "auto"
  results-dir:
    description: "Directory for scan results. Must be a real path (no symlinks), outside the source tree. Defaults to $RUNNER_TEMP/osdo-llm-scan. It is excluded from the scan."
    required: false
    default: ""

outputs:
  sarif-file:
    description: "Path to the Semgrep SARIF file (empty when semgrep is not enabled)"
    value: ${{ steps.semgrep.outputs.sarif }}
  vulnerabilities-found:
    description: "Total findings across all enabled checks"
    value: ${{ steps.consolidate.outputs.vulnerabilities-found }}
  critical-count:
    description: "Number of CRITICAL findings"
    value: ${{ steps.consolidate.outputs.critical-count }}
  high-count:
    description: "Number of HIGH findings"
    value: ${{ steps.consolidate.outputs.high-count }}
  findings-by-category:
    description: "JSON object: finding count per category (LLM01..LLM08, CODE, SHELL)"
    value: ${{ steps.consolidate.outputs.findings-by-category }}
  owasp-summary:
    description: "Finding count per OWASP LLM category checked by this action"
    value: ${{ steps.consolidate.outputs.owasp-summary }}
  scan-passed:
    description: "Whether the scan passed the fail-on-severity threshold"
    value: ${{ steps.consolidate.outputs.passed }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs and prepare results
      id: validate
      shell: bash
      env:
        OSDO_SOURCE: ${{ inputs.source-path }}
        OSDO_RESULTS_INPUT: ${{ inputs.results-dir }}
        OSDO_SCANNERS: ${{ inputs.scanners }}
      run: |
        set -euo pipefail
        if [ ! -d "$OSDO_SOURCE" ]; then
          echo "::error::source-path is not a directory: $OSDO_SOURCE"
          exit 1
        fi
        IFS=',' read -ra scanner_list <<< "$OSDO_SCANNERS"
        for scanner in "${scanner_list[@]}"; do
          scanner="${scanner// /}"
          case "$scanner" in
            ""|semgrep) ;;
            *)
              echo "::error::unsupported scanner '$scanner'. Supported: semgrep"
              exit 1
              ;;
          esac
        done
        results="${OSDO_RESULTS_INPUT:-${RUNNER_TEMP:?RUNNER_TEMP is not set; set results-dir explicitly}/osdo-llm-scan}"
        python3 -I "$GITHUB_ACTION_PATH/scripts/llm_checks.py" prepare \
          --source "$OSDO_SOURCE" --results-dir "$results" --findings "$results/findings.tsv"
        echo "results=$results" >> "$GITHUB_OUTPUT"

    - name: Detect LLM provider
      id: provider
      shell: bash
      env:
        OSDO_SOURCE: ${{ inputs.source-path }}
      run: |
        set -euo pipefail
        python3 -I "$GITHUB_ACTION_PATH/scripts/llm_checks.py" provider --source "$OSDO_SOURCE" >> "$GITHUB_OUTPUT"

    - name: Run Semgrep LLM rules
      id: semgrep
      if: contains(inputs.scanners, 'semgrep')
      shell: bash
      env:
        OSDO_SOURCE: ${{ inputs.source-path }}
        OSDO_RESULTS: ${{ steps.validate.outputs.results }}
      run: |
        set -euo pipefail
        if ! command -v semgrep >/dev/null 2>&1; then
          echo "::error::semgrep is not on PATH. Install it before osdo-llm-scan, or remove semgrep from scanners."
          exit 1
        fi
        rules="$GITHUB_ACTION_PATH/rules/llm-rules.yaml"
        sarif="$OSDO_RESULTS/semgrep-llm.sarif"
        # Without --error, semgrep exits 0 when it finds issues and non-zero only when
        # it fails to run. Findings are counted from SARIF, so a broken run fails here.
        # --x-ignore-semgrepignore-files: see osdo-sast/scripts/run-semgrep.sh. Without it,
        # semgrep silently skips test/ and fixture paths in the scanned repository.
        semgrep --x-ignore-semgrepignore-files --config "$rules" --config "p/python" --sarif --output "$sarif" "$OSDO_SOURCE"
        python3 -I "$GITHUB_ACTION_PATH/scripts/llm_checks.py" sarif \
          --sarif "$sarif" --findings "$OSDO_RESULTS/findings.tsv"
        echo "sarif=$sarif" >> "$GITHUB_OUTPUT"

    - name: Run custom LLM checks
      shell: bash
      env:
        OSDO_SOURCE: ${{ inputs.source-path }}
        OSDO_RESULTS: ${{ steps.validate.outputs.results }}
        OSDO_CHECK_PROMPT_INJECTION: ${{ inputs.check-prompt-injection }}
        OSDO_CHECK_PII_EXPOSURE: ${{ inputs.check-pii-exposure }}
        OSDO_CHECK_MODEL_SERIALIZATION: ${{ inputs.check-model-serialization }}
        OSDO_CHECK_OUTPUT_HANDLING: ${{ inputs.check-output-handling }}
        OSDO_CHECK_PROSE_INJECTION: ${{ inputs.check-prose-injection }}
        OSDO_CHECK_HIDDEN_UNICODE: ${{ inputs.check-hidden-unicode }}
        OSDO_CHECK_MCP_MANIFESTS: ${{ inputs.check-mcp-manifests }}
        OSDO_CHECK_TOOL_SCOPE: ${{ inputs.check-tool-scope }}
        OSDO_CHECK_SHELL_SCRIPTS: ${{ inputs.check-shell-scripts }}
      run: |
        set -euo pipefail
        python3 -I "$GITHUB_ACTION_PATH/scripts/llm_checks.py" scan \
          --source "$OSDO_SOURCE" \
          --results-dir "$OSDO_RESULTS" \
          --findings "$OSDO_RESULTS/findings.tsv"

    - name: Consolidate results
      id: consolidate
      shell: bash
      env:
        OSDO_RESULTS: ${{ steps.validate.outputs.results }}
        OSDO_THRESHOLD: ${{ inputs.fail-on-severity }}
      run: |
        set -euo pipefail
        python3 -I "$GITHUB_ACTION_PATH/scripts/llm_checks.py" consolidate \
          --findings "$OSDO_RESULTS/findings.tsv" \
          --threshold "$OSDO_THRESHOLD" >> "$GITHUB_OUTPUT"

    - name: Quality gate
      shell: bash
      env:
        OSDO_PASSED: ${{ steps.consolidate.outputs.passed }}
        OSDO_THRESHOLD: ${{ inputs.fail-on-severity }}
      run: |
        set -euo pipefail
        if [ "$OSDO_PASSED" != "true" ]; then
          echo "::error::LLM security scan found blocking findings at the ${OSDO_THRESHOLD} threshold. See the summary above."
          exit 1
        fi
        echo "LLM security scan passed the ${OSDO_THRESHOLD} threshold"
